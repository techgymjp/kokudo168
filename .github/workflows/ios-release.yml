name: iOS release (TestFlight)

# 既定ブランチに push すると、本番広告の設定で iOS 版をビルドし、App Store Connect（TestFlight）にアップロードする。
# 審査への提出は App Store Connect で行う（docs/IOS_BUILD.md）。
# 必要な Secrets：IOS_DIST_CERT_P12_BASE64 / IOS_DIST_CERT_PASSWORD / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8_BASE64
on:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'ios/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-release.yml'
  workflow_dispatch:

# アップロードの途中で止めないよう、新しい push があっても実行中のものは取り消さない（順番に実行する）
concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HAS_SECRETS: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
      # 手元の Mac から上げたビルド（1, 2, 3…）とぶつからないよう、100 から数える
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::iOS の Secrets が未登録なので、アップロードを省略します（docs/IOS_BUILD.md の 7 章）"

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.HAS_SECRETS == 'true'
        timeout-minutes: 5
        run: npm ci

      - name: Set version and build number
        if: env.HAS_SECRETS == 'true'
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "IOS_BUILD=$((100 + BUILD_NUMBER))" >> "$GITHUB_ENV"

      # 本番の広告 ID でコピーする（npm run ios:release と同じ）。タイトル画面のバージョン表示にもビルド番号を入れる
      - name: Copy web assets into the iOS project (production ads)
        if: env.HAS_SECRETS == 'true'
        run: |
          ADMOB_MODE=production VERSION_CODE="$IOS_BUILD" npm run build
          npx cap sync ios

      - name: Install the distribution certificate and API key
        if: env.HAS_SECRETS == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # 署名用のプロファイルは、API キーを使って Xcode が自動で作る（-allowProvisioningUpdates）
      - name: Archive
        if: env.HAS_SECRETS == 'true'
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD" MARKETING_VERSION="$VERSION_NAME" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -60

      - name: Upload to App Store Connect (TestFlight)
        if: env.HAS_SECRETS == 'true'
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ../ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -60
          echo "::notice::v${VERSION_NAME} (build ${IOS_BUILD}) をアップロードしました。10〜30 分ほどで TestFlight に表示されます"

      - name: Clean up
        if: always() && env.HAS_SECRETS == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
